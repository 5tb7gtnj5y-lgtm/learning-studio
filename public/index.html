.interact-tabs button[aria-selected="true"]{background:#205dc5;color:white}

.interact-step .step-number{border-radius:99px;background:#205dc5;color:white;font-weight:700;font-size:13px;width:28px;height:28px;text-align:center;padding-top:5px;flex:none}

.editor-item input[type=file]{max-width:100%}

.course-utility{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
body[data-theme="midnight"] .interact{color:#1f3654}
body[data-theme="midnight"] .block-library{background:#24374f}

</script><script>
const app=document.getElementById('app');let admin=false,course=null,id=null,activePage=null,activeBlock=null,mode='home',published=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID();
async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function button(label,act,primary=false){return `<button class="${primary?'primary':''}" data-action="${esc(act)}">${esc(label)}</button>`}
function renderHeader(){document.getElementById('startup-status')?.remove();return `<header class="top"><div class="brand">◈ Learning <span>Studio</span></div><div class="actions">${mode==='edit'?button('Dashboard','home')+button('Backup JSON','export')+button('Save draft','save')+button('Preview','preview')+button('Publish','publish',true):mode==='preview'?button('Back to editing','edit'):button('All learning','home')}${admin?button('Log out','logout'):button('Admin login','login')}</div></header>`}
function normalizeCourse(){if(!course.menuPageId){course.menuPageId=course.pages[0].id;if(course.pages[0].title==='Welcome')course.pages[0].title='Learning menu'}course.menuCards=Array.isArray(course.menuCards)?course.menuCards:[];course.theme=course.theme||'classic'}

function isMenu(){return activePage===menuId()}
function setTheme(){document.body.dataset.theme=course?.theme||'classic'}
function menuCards(editing=false){return editing?'<h2>Learning menu</h2><p class="muted">Every card is linked to a learning page. Edit the description and upload a thumbnail below.</p>'+course.menuCards.map((card,i)=>'<div class="menu-edit-card"><strong>'+esc(card.title)+'</strong><div class="field"><label for="carddesc'+i+'">Card description</label><textarea id="carddesc'+i+'" data-carddesc="'+i+'" maxlength="500" placeholder="Add a short description for learners...">'+esc(card.description||'')+'</textarea></div><div class="field"><label for="cardimg'+i+'">Small card image (maximum 300 KB)</label><input id="cardimg'+i+'" type="file" accept="image/png,image/jpeg,image/webp" data-cardimg="'+i+'"></div>'+(card.image?'<img src="'+esc(card.image)+'" alt="" class="menu-card-thumb">'+button('Remove image','clearcardimg:'+i):'')+'<div class="menu-card-controls">'+button('Open page','page:'+card.pageId)+button('Rename card','renamecard:'+i)+button('Remove card','removecard:'+i)+'</div></div>').join('')+button('+ Add menu card and page','newcard',true):'<div class="menu-grid">'+course.menuCards.filter(card=>course.pages.some(p=>p.id===card.pageId)).map(card=>'<button class="menu-card" data-action="page:'+esc(card.pageId)+'"><span class="menu-card-inner">'+(card.image?'<img class="menu-card-thumb" src="'+esc(card.image)+'" alt="">':'<span class="menu-card-placeholder"></span>')+'<span class="menu-card-body"><strong>'+esc(card.title)+'</strong>'+(card.description?'<span class="menu-card-description" style="display:block">'+esc(card.description)+'</span>':'')+'<span>Explore topic →</span></span></span></button>').join('')+'</div>'}
function page(){return course.pages.find(p=>p.id===activePage)||course.pages[0]}
function currentBlock(){return page()?.blocks.find(b=>b.id===activeBlock)}
function streamUrl(s){try{const u=new URL(s);return u.protocol==='https:'&&/(^|\.)(sharepoint\.com|microsoft\.com)$/.test(u.hostname)||u.protocol==='https:'&&u.hostname==='web.microsoftstream.com'}catch{return false}}
const tabSelection={};
function renderExtra(b,edit=false){
 const items=Array.isArray(b.items)?b.items:[];
 const safe=(s)=>esc(s??'');
 const p=(s)=>'<p style="white-space:pre-wrap">'+safe(s)+'</p>';
 if(b.type==='divider')return '<hr class="divider-block" aria-label="Section divider">';
 if(b.type==='table')return '<section class="interact"><h3>'+safe(b.heading||'Reference table')+'</h3><table class="content-table"><thead><tr><th scope="col">Item</th><th scope="col">Details</th></tr></thead><tbody>'+items.map(i=>'<tr><th scope="row">'+safe(i.title)+'</th><td>'+safe(i.body)+'</td></tr>').join('')+'</tbody></table></section>';
 if(b.type==='code')return '<section class="interact"><h3>'+safe(b.heading||'Code example')+'</h3><pre style="white-space:pre-wrap;overflow-x:auto;background:#172c44;color:#fff;padding:15px;border-radius:9px"><code>'+safe(b.text)+'</code></pre></section>';
 if(b.type==='quote')return '<blockquote class="quote-block">'+safe(b.text)+(b.heading?'<span class="quote-by">— '+safe(b.heading)+'</span>':'')+'</blockquote>';
 if(b.type==='statement')return '<div class="statement-block">'+safe(b.text)+'</div>';
 if(b.type==='accordion')return '<section class="interact"><h3>'+safe(b.heading||'Explore more')+'</h3>'+items.map(i=>'<details><summary>'+safe(i.title)+'</summary>'+p(i.body)+'</details>').join('')+'</section>';
 if(b.type==='flashcards')return '<section class="interact"><h3>'+safe(b.heading||'Reveal the answers')+'</h3><div class="grid">'+items.map(i=>'<details><summary>'+safe(i.title)+' <span class="reveal">(reveal)</span></summary>'+p(i.body)+'</details>').join('')+'</div></section>';
 if(b.type==='tabs'){
   const active=Math.max(0,Math.min(items.length-1,tabSelection[b.id]||0));
   return '<section class="interact"><h3>'+safe(b.heading||'Explore the topics')+'</h3><div class="interact-tabs" role="tablist" aria-label="'+safe(b.heading||'Topics')+'">'+items.map((item,i)=>'<button type="button" role="tab" aria-selected="'+(active===i)+'" tabindex="'+(active===i?'0':'-1')+'" data-action="tab:'+b.id+':'+i+'">'+safe(item.title)+'</button>').join('')+'</div><div role="tabpanel" id="panel_'+b.id+'" aria-live="polite">'+p(items[active]?.body||'')+'</div></section>';
 }
 if(b.type==='timeline'||b.type==='process')return '<section class="interact"><h3>'+safe(b.heading||(b.type==='timeline'?'Timeline':'Step-by-step process'))+'</h3>'+items.map((i,j)=>'<div class="interact-step"><span class="step-number">'+(j+1)+'</span><div><strong>'+safe(i.title)+'</strong>'+p(i.body)+'</div></div>').join('')+'</section>';
 if(b.type==='checklist')return '<section class="interact"><h3>'+safe(b.heading||'Checklist')+'</h3>'+items.map((i,j)=>'<label style="display:flex;gap:10px;align-items:flex-start;margin:12px 0"><input type="checkbox" '+(edit?'disabled':'')+'><span><strong>'+safe(i.title)+'</strong>'+(i.body?' — '+safe(i.body):'')+'</span></label>').join('')+'</section>';
 if(b.type==='scenario')return '<section class="interact"><h3>'+safe(b.heading||'What would you do?')+'</h3>'+p(b.text||'Choose a response to explore the outcome.')+'<div class="course-utility">'+items.map((i,j)=>button(i.title,'scenario:'+b.id+':'+j)).join('')+'</div><div id="scenario_'+b.id+'" role="status" style="margin-top:10px"></div></section>';
 if(b.type==='gallery')return '<section class="interact"><h3>'+safe(b.heading||'Image gallery')+'</h3><div class="gallery-block">'+items.map(i=>'<figure>'+(i.image?'<img src="'+safe(i.image)+'" alt="'+safe(i.body||i.title)+'">':'<div class="menu-card-placeholder" style="width:100%;height:140px"></div>')+'<figcaption>'+safe(i.title)+'</figcaption></figure>').join('')+'</div></section>';
 if(b.type==='linkbutton'){
   const target=course.pages.find(x=>x.id===b.target);
   return target?'<div class="course-utility">'+button(b.heading||('Open '+target.title),'page:'+target.id,true)+'</div>':'<p class="muted">Choose a target page in Properties.</p>';
 }

}
function formatText(src){
 const inline=(s)=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
 const lines=String(src||'').split(/\r?\n/);let out='',inList=false;
 const close=()=>{if(inList){out+='</ul>';inList=false}};
 for(const line of lines){
   const title=line.match(/^(#{1,3})\s+(.*)$/),bullet=line.match(/^\s*[-•]\s+(.*)$/);
   if(title){close();const n=Math.min(4,title[1].length+1);out+='<h'+n+'>'+inline(title[2])+'</h'+n+'>';}
   else if(bullet){if(!inList){out+='<ul>';inList=true}out+='<li>'+inline(bullet[1])+'</li>';}
   else if(!line.trim()){close();out+='<div class="text-gap"></div>';}
   else {close();out+='<p>'+inline(line)+'</p>';}
 }
 close();return '<div class="lesson-text">'+out+'</div>';
}
function renderBlock(b,edit=false){let x='';if(b.type==='text')x=formatText(b.text);

if(b.type==='video')x=b.url&&streamUrl(b.url)?`<iframe class="video" src="${esc(b.url)}" title="Microsoft Stream video" allow="autoplay; fullscreen" allowfullscreen></iframe>`:'<p class="muted">Paste a Stream embed URL in Properties</p>';
if(b.type==='info')x=`<div class="info"><strong>${esc(b.heading||'Key point')}</strong><p>${esc(b.text)}</p></div>`;
if(b.type==='quiz'){const q=b.questions[0];x=`<div class="quiz"><strong>${esc(q.prompt)}</strong>${q.options.map((op,i)=>`<label><input type="${q.multiple?'checkbox':'radio'}" name="q_${b.id}" value="${i}" ${edit?'disabled':''}>${esc(op)}</label>`).join('')}${edit?'<p class="muted">Optional knowledge check — learners can always continue.</p>':button('Check answer','check:'+b.id,true)+`<div role="status" id="feedback_${b.id}"></div>`}</div>`}

async function home(){mode='home';const list=await api('/api/published'),all=admin?await api('/api/courses'):[];app.innerHTML=renderHeader()+`<main class="wrap"><div class="hero"><h1>Build better learning</h1><p>Pages, media and optional knowledge checks — made simple.</p>${admin?button('+ New learning','create',true):''}</div>${admin?`<h2>Administrator dashboard</h2><p>Import a Learning Studio backup: <input type="file" accept="application/json,.json" id="import-json" aria-label="Import learning JSON backup"></p><div class="grid">${all.map(c=>`<article class="card"><h2>${esc(c.title)}</h2><p class="muted">${c.published?'Published':'Draft'}</p>${button('Edit','open:'+c.id,true)} ${button('Duplicate','duplicatecourse:'+c.id)+button('Delete','delete:'+c.id)}</article>`).join('')||'<p>No courses yet.</p>'}</div>`:''}<h2>Published learning</h2><div class="grid">${list.map(c=>`<article class="card"><h2>${esc(c.title)}</h2>${button('Start learning','learn:'+c.id,true)}</article>`).join('')||'<p>No published learning yet.</p>'}</div></main>`;wire();const uploader=document.getElementById('import-json');if(uploader)uploader.onchange=async()=>{try{await importCourse(uploader.files[0])}catch(e){alert(e.message)}}}
function extraProperties(b){
 const t=b.type;
 if(!['quote','statement','divider','accordion','tabs','flashcards','timeline','process','checklist','scenario','gallery','linkbutton','table','code'].includes(t))return '';
 if(t==='divider')return '<p class="muted">A visual divider separates sections of the lesson.</p>';
 if(t==='code')return field('Code block title','heading',b.heading)+field('Code / technical example','text',b.text,true);
 if(t==='quote')return field('Quotation','text',b.text,true)+field('Attribution','heading',b.heading);
 if(t==='statement')return field('Key statement','text',b.text,true);
 if(t==='linkbutton')return field('Button label','heading',b.heading)+`<div class="field"><label for="blocktarget">Link to page</label><select id="blocktarget" data-bprop="target"><option value="">Choose a page</option>${course.pages.map(p=>`<option value="${esc(p.id)}" ${b.target===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select></div>`;
 let out=field('Section title','heading',b.heading);
 if(t==='scenario')out+=field('Scenario question','text',b.text,true);
 if(t==='gallery')out+='<p class="muted">Add gallery images one at a time, or replace an existing image.</p>';
 if(!Array.isArray(b.items))b.items=[];
 out+='<h3>Items ('+b.items.length+')</h3>';
 b.items.forEach((i,n)=>{
   out+='<div class="editor-item"><label>Item '+(n+1)+' title</label><input data-itemtitle="'+n+'" maxlength="160" value="'+esc(i.title)+'"><label>'+(t==='scenario'?'Outcome / feedback':t==='gallery'?'Image description (alt text)':'Description / back of card')+'</label><textarea data-itembody="'+n+'">'+esc(i.body||'')+'</textarea>';
   if(t==='gallery')out+='<label>Image (up to 300 KB)</label><input type="file" accept="image/png,image/jpeg,image/webp" data-itemimage="'+n+'">';
   out+=`<div class="course-utility">${button('↑','itemup:'+n)}${button('↓','itemdown:'+n)}${button('Remove','itemremove:'+n)}</div></div>`;
 });
 out+=button('+ Add item','itemadd',true);
 return out;
}
function properties(){const b=currentBlock();let out='<h2>Learning design</h2><div class="theme-picker">'+[['classic','Classic blue'],['modern','Modern purple'],['nature','Nature green'],['sunset','Warm sunset'],['midnight','Midnight']].map(([key,name])=>'<button class="'+(course.theme===key?'chosen':'')+'" data-action="theme:'+key+'">'+name+'</button>').join('')+'</div>'+`<h2>Page settings</h2>${field('Course title','courseTitle',course.title)}${field('Page title','pageTitle',page().title)}<div class="field"><label for="link">After this page</label><select id="link" data-prop="link"><option value="next">Next page</option><option value="menu">Main menu</option><option value="none">No next button</option>${course.pages.filter(p=>p.id!==activePage).map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select></div>`;
if(isMenu())return out+'<p class="muted">Each card creates and links a learning page automatically.</p>';if(!b)return out+'<p class="muted">Choose a content block to edit.</p>';
out+=`<hr><h2>${esc(b.type)} block</h2>`;
if(b.type==='text')out+='<p class="muted">Use the buttons below or type headings (#), bullet points (-), **bold** and *italics*.</p><div class="editor-formatbar">'+button('Bold','format:bold')+button('Italic','format:italic')+button('Heading','format:heading')+button('Bullet','format:bullet')+'</div>';
if(b.type==='text'||b.type==='info')out+=(b.type==='info'?field('Panel heading','heading',b.heading):'')+field('Text','text',b.text,true);
if(b.type==='image')out+=`<div class="field"><label>Upload image (600 KB maximum)</label><input type="file" id="upload" accept="image/*"></div>`+field('Alternative text','alt',b.alt)+field('Text beside image','text',b.text,true)+`<div class="field"><label>Layout</label><select data-bprop="layout">${['full','left','right'].map(v=>`<option value="${v}" ${b.layout===v?'selected':''}>${v==='full'?'Image only':v==='left'?'Image left':'Image right'}</option>`).join('')}</select></div>`;
if(b.type==='video')out+=field('Microsoft Stream embed URL','url',b.url);
out+=extraProperties(b);
if(b.type==='quiz'){const q=b.questions[0];out+=field('Question','prompt',q.prompt,true)+`<div class="field"><label>Answer type</label><select id="qtype"><option value="single">One correct answer</option><option value="multiple" ${q.multiple?'selected':''}>Several correct answers</option></select></div>`+q.options.map((v,i)=>`<div class="field"><label>Answer ${i+1}</label><input data-option="${i}" value="${esc(v)}"><label><input type="${q.multiple?'checkbox':'radio'}" name="correct" data-correct="${i}" ${q.correct.includes(i)?'checked':''}> Correct</label></div>`).join('')+button('+ Answer','addanswer')+button('Remove answer','removeanswer')+field('Correct feedback','correctFeedback',q.correctFeedback)+field('Incorrect feedback','wrongFeedback',q.wrongFeedback)}
return out}
function field(label,name,value='',multiline=false){return `<div class="field"><label>${esc(label)}</label>${multiline?`<textarea data-bprop="${name}">${esc(value)}</textarea>`:`<input data-${name==='courseTitle'||name==='pageTitle'?'prop':'bprop'}="${name}" value="${esc(value||'')}">`}</div>`}
let blockPickerOpen=false;
function blockCatalog(){
 return [
 ['text','Text','Headings, bold text and lists'],
 ['table','Simple table','Two-column reference table'],
 ['code','Code snippet','Show a technical example'],
 ['image','Image and text','Upload an image'],
 ['video','Stream video','Embed Microsoft Stream'],
 ['info','Information panel','Tips and guidance'],
 ['quote','Quote','Highlighted quotation'],
 ['statement','Statement','Bold key message'],
 ['divider','Divider','Split up a lesson'],
 ['accordion','Accordion','Reveal expandable answers'],
 ['tabs','Tabs','Switch between topics'],
 ['flashcards','Flashcards','Turn cards and reveal'],
 ['timeline','Timeline','Explore events in order'],
 ['process','Process','Step-by-step walkthrough'],
 ['checklist','Checklist','Interactive tick boxes'],
 ['scenario','Scenario','Explore choices and feedback'],
 ['gallery','Image gallery','Grid of small images'],
 ['linkbutton','Page button','Link to another lesson'],
 ['quiz','Knowledge check','Optional question and feedback']
 ];
}
function blockPalette(){
 return '<section class="block-library" aria-label="Choose content block">'+blockCatalog().map(([key,label,description])=>'<button type="button" data-action="insert:'+key+'"><strong>'+esc(label)+'</strong><small>'+esc(description)+'</small></button>').join('')+'</section>'+button('Cancel','cancelpicker');
}
function createStarterBlock(type){
 const b={id:uid(),type,text:'',heading:'',layout:'full',url:''};
 if(type==='text')b.text='Enter your learning content.';
 if(type==='info'){b.heading='Important information';b.text='Add some guidance.'}if(type==='code'){b.heading='Code example';b.text='Paste technical content here.'}
 if(type==='quote'){b.text='Add a quotation';b.heading=''}
 if(type==='statement')b.text='A key learning point';
 if(type==='linkbutton')b.heading='Continue learning';
 if(type==='scenario'){b.heading='Choose what you would do';b.text='A learner asks for help. What do you say?'}
 if(['accordion','tabs','flashcards','timeline','process','checklist','scenario','gallery','table'].includes(type)){
  b.heading=b.heading||({accordion:'Explore the details',tabs:'Key topics',flashcards:'Check your knowledge',timeline:'Timeline',process:'Step-by-step process',checklist:'Things to remember',gallery:'Image gallery',table:'Reference table'}[type]||'');
  b.items=type==='scenario'?[{title:'Option A',body:'Describe what happens when A is chosen'},{title:'Option B',body:'Describe what happens when B is chosen'}]:[{title:'First item',body:'Add your description'},{title:'Second item',body:'Add your description'}];
 }
 if(type==='quiz')b.questions=[{prompt:'Your question',options:['Answer A','Answer B'],correct:[0],multiple:false,correctFeedback:'Correct!',wrongFeedback:'Not quite. Try again.'}];
 return b;
}
let templatePanelOpen=false;
function templatePalette(){
 const arr=[['overview','Introduction','Heading, overview and key point'],['faq','Frequently asked questions','Ready-made accordion'],['procedure','Step-by-step guide','Process and learner checklist'],['practice','Practice activity','Scenario and optional knowledge check'],['recap','Key takeaways','Quotation, statement and checklist']];
 return '<section class="block-library" aria-label="Insert starter layout">'+arr.map(([key,title,desc])=>'<button data-action="template:'+key+'"><strong>'+esc(title)+'</strong><small>'+esc(desc)+'</small></button>').join('')+'</section>'+button('Close layouts','closetemplates');
}
function insertTemplate(key){
 const item=(title,body)=>({title,body});
 const block=(type,heading='',text='',items=[])=>({id:uid(),type,heading,text,items});
 let blocks=[];
 if(key==='overview')blocks=[block('statement','','What you will learn'),block('text','','Explain the purpose of this learning and what learners should be able to do at the end.'),block('info','Key point','Add an important reminder here.')];
 if(key==='faq')blocks=[block('text','','Frequently asked questions'),block('accordion','Common questions','',[item('Question one','Answer to question one.'),item('Question two','Answer to question two.'),item('Question three','Answer to question three.')])];
 if(key==='procedure')blocks=[block('process','How to complete this task','',[item('Step one','Explain the first step.'),item('Step two','Explain the second step.'),item('Step three','Explain the final step.')]),block('checklist','Before you finish','',[item('Confirm the details',''),item('Check the result','')])];
 if(key==='practice')blocks=[block('scenario','Choose the best response','A customer has a question. How would you respond?',[item('Offer to help','Explain the consequences of this response.'),item('Ask for more detail','Explain what you could discover.')]),createStarterBlock('quiz')];
 if(key==='recap')blocks=[block('quote','A useful reminder','Add a memorable quotation.'),block('statement','','Key things to remember'),block('checklist','Recap checklist','',[item('Main point',''),item('Next action','')])];
 if(!blocks.length)return;
 page().blocks.push(...blocks);activeBlock=blocks[0].id;
 blockPickerOpen=false;templatePanelOpen=false;edit();
}
function exportCourse(){
 const blob=new Blob([JSON.stringify(course,null,2)],{type:'application/json'}),link=document.createElement('a'),url=URL.createObjectURL(blob);
 link.href=url;link.download=(course.title||'learning-studio').replace(/[^a-z0-9_-]+/gi,'-').slice(0,60)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importCourse(file){
 if(!file||file.size>4000000)throw Error('Choose a Learning Studio JSON backup under 4 MB');
 const data=JSON.parse(await file.text());
 if(!data||typeof data.title!=='string'||!Array.isArray(data.pages)||data.pages.length<1||data.pages.length>100||!data.pages.every(p=>p&&typeof p.title==='string'&&Array.isArray(p.blocks)))throw Error('This is not a valid Learning Studio backup');
 if(!confirm('Import "'+data.title+'" as a new learning package?'))return;
 data.title=data.title+' (imported)';
 const created=await api('/api/courses','POST');await api('/api/courses/'+created.id,'PUT',data);await open(created.id);
}
function edit(){mode='edit';normalizeCourse();setTheme();if(!course.pages.some(p=>p.id===activePage))activePage=menuId();app.innerHTML=renderHeader()+`<div class="workspace"><aside class="side"><h2>Pages</h2>${course.pages.map(p=>button(p.id===menuId()?'⌂ '+p.title:p.title,'page:'+p.id)).join('')}<p>${button('+ Add menu card','newcard',true)}</p>${!isMenu()?button('Delete page','delpage'):''}</aside><main class="paper"><h1>${esc(page().title)}</h1>${isMenu()?menuCards(true):'<p class="muted">Drag a section to reorder it</p>'+page().blocks.map(b=>renderBlock(b,true)).join('')+(blockPickerOpen?blockPalette():button('+ Add content','addblock',true)+button('Use starter layout','templates'))+(templatePanelOpen?templatePalette():'')}</main><aside class="side properties">${properties()}</aside></div>`;const sel=document.querySelector('[data-prop="link"]');if(sel)sel.value=page().link||'next';wire();wireProperties();wireCards();drag()}
function learner(preview=false){mode=preview?'preview':'learn';normalizeCourse();setTheme();const p=page(),index=course.pages.indexOf(p);app.innerHTML=renderHeader()+`<div class="wrap" style="max-width:1380px"><main class="paper"><h1>${esc(p.title)}</h1>${isMenu()?menuCards(false):p.blocks.map(b=>renderBlock(b)).join('')+`<div class="footer">${button('← Back to menu','menu')}${button('Next page →','next',true)}</div>`}</main></div>`;wire()}
function wireCards(){document.querySelectorAll('[data-carddesc]').forEach(el=>{el.onchange=()=>{const card=course.menuCards[Number(el.dataset.carddesc)];if(card)card.description=el.value}});document.querySelectorAll('[data-cardimg]').forEach(el=>{el.onchange=()=>{const file=el.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>300000)return alert('Please choose a PNG, JPG or WebP under 300 KB');const reader=new FileReader();reader.onload=()=>{const card=course.menuCards[Number(el.dataset.cardimg)];if(card){card.image=reader.result;edit()}};reader.readAsDataURL(file)}})}
function wireProperties(){document.querySelectorAll('[data-itemtitle]').forEach(el=>el.onchange=()=>{const b=currentBlock();if(b?.items?.[+el.dataset.itemtitle])b.items[+el.dataset.itemtitle].title=el.value;edit()});document.querySelectorAll('[data-itembody]').forEach(el=>el.onchange=()=>{const b=currentBlock();if(b?.items?.[+el.dataset.itembody])b.items[+el.dataset.itembody].body=el.value;edit()});document.querySelectorAll('[data-itemimage]').forEach(el=>el.onchange=()=>{const file=el.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>300000)return alert('Choose a JPG, PNG or WebP image under 300 KB');const b=currentBlock(),item=b?.items?.[+el.dataset.itemimage];if(!item)return;const reader=new FileReader();reader.onload=()=>{item.image=reader.result;edit()};reader.readAsDataURL(file)});document.querySelectorAll('[data-prop]').forEach(e=>e.onchange=()=>{if(e.dataset.prop==='courseTitle')course.title=e.value;if(e.dataset.prop==='pageTitle')page().title=e.value;if(e.dataset.prop==='link')page().link=e.value;edit()});document.querySelectorAll('[data-bprop]').forEach(e=>e.onchange=()=>{let b=currentBlock();if(b.type==='quiz')b.questions[0][e.dataset.bprop]=e.value;else b[e.dataset.bprop]=e.value;edit()});document.querySelectorAll('[data-option]').forEach(e=>e.onchange=()=>{currentBlock().questions[0].options[+e.dataset.option]=e.value;edit()});document.querySelectorAll('[data-correct]').forEach(e=>e.onchange=()=>{let q=currentBlock().questions[0],i=+e.dataset.correct;if(!q.multiple)q.correct=[i];else q.correct=e.checked?[...new Set([...q.correct,i])]:q.correct.filter(n=>n!==i);edit()});const t=document.getElementById('qtype');if(t)t.onchange=()=>{const q=currentBlock().questions[0];q.multiple=t.value==='multiple';q.correct=[0];edit()};const u=document.getElementById('upload');if(u)u.onchange=()=>{const f=u.files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>600000)return alert('Use an image smaller than 600 KB');const reader=new FileReader();reader.onload=()=>{currentBlock().src=reader.result;edit()};reader.readAsDataURL(f)}}
function drag(){let moving;document.querySelectorAll('[data-drag]').forEach(e=>{e.ondragstart=()=>moving=e.dataset.drag;e.ondragover=ev=>ev.preventDefault();e.ondrop=ev=>{ev.preventDefault();let blocks=page().blocks,i=blocks.findIndex(b=>b.id===moving),j=blocks.findIndex(b=>b.id===e.dataset.drag);if(i>=0&&j>=0&&i!==j)blocks.splice(j,0,blocks.splice(i,1)[0]);edit()}})}
async function open(id,view=false){const r=await api(view?'/api/published/'+id:'/api/courses/'+id);course=view?r:r.course;published=view||!!r.published;normalizeCourse();activePage=menuId();activeBlock=null;window.courseId=id;view?learner():edit()}
const actions={home,templates:()=>{templatePanelOpen=true;blockPickerOpen=false;edit()},closetemplates:()=>{templatePanelOpen=false;edit()},export:exportCourse,menu:()=>{activePage=menuId();learner(mode==='preview')},next:()=>{const i=course.pages.findIndex(p=>p.id===activePage);activePage=course.pages[i+1]?.id||menuId();learner(mode==='preview')},newcard:()=>{const name=prompt('Name of menu card and learning page','New topic')?.trim();if(!name)return;const p={id:uid(),title:name,blocks:[],link:'next'};course.pages.push(p);course.menuCards.push({title:name,pageId:p.id});activePage=menuId();activeBlock=null;edit()},login:()=>{mode='login';app.innerHTML=renderHeader()+`<main class="wrap" style="max-width:450px"><section class="card"><h1>Administrator login</h1><label for="pw">Password</label><input type="password" id="pw"><p>${button('Log in','submitlogin',true)}</p><p id="error" role="alert"></p></section></main>`;wire()},submitlogin:async()=>{try{await api('/api/login','POST',{password:document.getElementById('pw').value});admin=true;home()}catch(e){document.getElementById('error').textContent=e.message}},logout:async()=>{await api('/api/logout','POST');admin=false;home()},create:async()=>{const r=await api('/api/courses','POST');open(r.id)},save:async()=>{await api('/api/courses/'+window.courseId,'PUT',course);alert('Draft saved')},publish:async()=>{await api('/api/courses/'+window.courseId,'PUT',course);await api('/api/courses/'+window.courseId+'/publish','POST');published=true;alert('Published. Share: '+location.origin+'/?learn='+window.courseId);edit()},preview:()=>learner(true),edit,previous:()=>{let i=course.pages.findIndex(p=>p.id===activePage);activePage=course.pages[Math.max(0,i-1)].id;learner(mode==='preview')},continue:()=>{const p=page();if(p.link==='menu')return home();let next=p.link==='next'?course.pages[course.pages.indexOf(p)+1]?.id:p.link;if(!next)return home();activePage=next;learner(mode==='preview')},newpage:()=>{const t=prompt('New page title','New page');if(t){const p={id:uid(),title:t,blocks:[],link:'next'};course.pages.push(p);activePage=p.id;activeBlock=null;edit()}},delpage:()=>{if(isMenu())return alert('The learning menu cannot be deleted');if(course.pages.length===1)return alert('Keep at least one page');if(confirm('Delete this page?')){course.pages=course.pages.filter(p=>p.id!==activePage);course.menuCards=course.menuCards.filter(card=>card.pageId!==activePage);activePage=menuId();edit()}},addblock:()=>{blockPickerOpen=true;edit()},cancelpicker:()=>{blockPickerOpen=false;edit()},addanswer:()=>{currentBlock().questions[0].options.push('Another answer');edit()},removeanswer:()=>{const q=currentBlock().questions[0];if(q.options.length>2){q.options.pop();q.correct=q.correct.filter(i=>i<q.options.length);edit()}}};
function wire(){document.querySelectorAll('[data-action]').forEach(el=>el.onclick=async()=>{try{const a=el.dataset.action;if(actions[a])return await actions[a]();if(a.startsWith('format:')){const b=currentBlock(),el=document.querySelector('textarea[data-bprop="text"]');if(!b||!el)return;const start=el.selectionStart,end=el.selectionEnd,selected=el.value.slice(start,end),kind=a.slice(7),pair=kind==='bold'?'**':kind==='italic'?'*':'';const replacement=kind==='heading'?'# '+(selected||'Heading'):kind==='bullet'?'- '+(selected||'List item'):pair+(selected||'Text')+pair;b.text=el.value.slice(0,start)+replacement+el.value.slice(end);return edit()}if(a.startsWith('template:'))return insertTemplate(a.slice(9));if(a.startsWith('duplicatecourse:')){const source=await api('/api/courses/'+a.slice(16));const newCourse=structuredClone(source.course);newCourse.title+=' (copy)';const created=await api('/api/courses','POST');await api('/api/courses/'+created.id,'PUT',newCourse);return home()}if(a.startsWith('insert:')){const type=a.slice(7);if(!blockCatalog().some(row=>row[0]===type))return;const b=createStarterBlock(type);page().blocks.push(b);activeBlock=b.id;blockPickerOpen=false;return edit()}if(a.startsWith('itemadd')){const b=currentBlock();if(b&&Array.isArray(b.items)){b.items.push({title:'New item',body:'Add details here'});return edit()}}if(a.startsWith('itemremove:')||a.startsWith('itemup:')||a.startsWith('itemdown:')){const b=currentBlock();if(!b||!Array.isArray(b.items))return;const i=Number(a.split(':')[1]);if(a.startsWith('itemremove:')){if(b.items.length>1)b.items.splice(i,1)}else{const j=i+(a.startsWith('itemup:')?-1:1);if(j>=0&&j<b.items.length)b.items.splice(j,0,b.items.splice(i,1)[0])}return edit()}if(a.startsWith('tab:')){const [,blockId,n]=a.split(':');tabSelection[blockId]=Number(n);return learner(mode==='preview')}if(a.startsWith('scenario:')){const [,blockId,n]=a.split(':');const b=page().blocks.find(p=>p.id===blockId);const dest=document.getElementById('scenario_'+blockId);if(dest&&b?.items?.[Number(n)]){dest.textContent=b.items[Number(n)].body;dest.classList.add('notice')}return}if(a.startsWith('clearcardimg:')){const card=course.menuCards[Number(a.split(':')[1])];if(card)delete card.image;return edit()}if(a.startsWith('theme:')){course.theme=a.slice(6);return edit()}if(a.startsWith('renamecard:')){const card=course.menuCards[Number(a.split(':')[1])];if(!card)return;const name=prompt('Card and page name',card.title)?.trim();if(name){card.title=name;const p=course.pages.find(p=>p.id===card.pageId);if(p)p.title=name;}return edit()}if(a.startsWith('removecard:')){const i=Number(a.split(':')[1]),card=course.menuCards[i];if(card&&confirm('Remove this card and its page?')){course.pages=course.pages.filter(p=>p.id!==card.pageId);course.menuCards.splice(i,1);activePage=menuId()}return edit()}if(a.startsWith('open:'))return open(a.slice(5));if(a.startsWith('learn:'))return open(a.slice(6),true);if(a.startsWith('page:')){activePage=a.slice(5);activeBlock=null;return mode==='edit'?edit():learner(mode==='preview')}if(a.startsWith('select:')){activeBlock=a.slice(7);return edit()}if(a.startsWith('remove:')){page().blocks=page().blocks.filter(b=>b.id!==a.slice(7));activeBlock=null;return edit()}if(a.startsWith('duplicate:')){const b=page().blocks.find(b=>b.id===a.slice(10));page().blocks.push({...structuredClone(b),id:uid()});return edit()}if(a.startsWith('up:')||a.startsWith('down:')){const i=course.pages.findIndex(p=>p.id===a.split(':')[1]),j=i+(a.startsWith('up:')?-1:1);if(j>=0&&j<course.pages.length)course.pages.splice(j,0,course.pages.splice(i,1)[0]);return edit()}if(a.startsWith('delete:')){if(confirm('Permanently delete this course?')){await api('/api/courses/'+a.slice(7),'DELETE');home()}return}if(a.startsWith('check:')){const b=page().blocks.find(b=>b.id===a.slice(6)),q=b.questions[0],chosen=[...document.querySelectorAll(`input[name="q_${b.id}"]:checked`)].map(x=>+x.value);const good=[...chosen].sort().join(',')===[...q.correct].sort().join(',');document.getElementById('feedback_'+b.id).textContent=good?q.correctFeedback:q.wrongFeedback;return}}catch(e){alert(e.message)}})}
(async()=>{try{admin=(await api('/api/session')).admin;const id=new URLSearchParams(location.search).get('learn');if(id)await open(id,true);else await home()}catch(e){app.innerHTML=`<main class="wrap"><section class="card"><h1>Setup required</h1><p>${esc(e.message)}</p><p>Connect your Cloudflare D1 database and configure Worker secrets.</p></section></main>`}})();
</script></body></html>
