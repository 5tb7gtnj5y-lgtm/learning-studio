<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#1e2c46;font:15px system-ui,Arial}button,input,textarea,select{font:inherit}button{border:0;border-radius:8px;padding:9px 13px;background:#e8edf6;color:#20375f;cursor:pointer}button:hover{filter:brightness(.96)}button.primary{background:#205dc5;color:white}button:focus-visible,input:focus-visible{outline:3px solid orange}input,textarea,select{padding:9px;border:1px solid #cad4e4;border-radius:8px;max-width:100%}textarea{min-height:70px;width:100%}.top{background:white;border-bottom:1px solid #dae2ec;padding:16px 24px;display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.brand{font-size:22px;font-weight:750}.brand span{color:#205dc5}.actions{display:flex;flex-wrap:wrap;gap:8px}.wrap{max-width:1100px;margin:36px auto;padding:0 18px}.hero{background:#e4eeff;padding:28px;border-radius:16px}.card,.paper,.side{background:white;border:1px solid #dfe6ef;border-radius:13px;padding:20px}.card{margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.workspace{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;gap:14px;padding:16px;align-items:start}.paper{min-height:420px}.side{position:sticky;top:10px}.block{padding:15px;border:1px solid #d9e2ee;border-radius:10px;margin:12px 0;background:white}.block.active{outline:2px solid #205dc5}.block[draggable]{cursor:grab}.toolbar{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.toolbar button{padding:5px 8px;font-size:12px}.nav{display:block;width:100%;margin:5px 0;text-align:left}.nav.active{background:#dce9ff}.muted{color:#697991;font-size:13px}.image{max-width:100%;border-radius:8px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}.info{padding:16px;border-left:4px solid #205dc5;background:#eff5ff}.quiz{padding:17px;background:#f4f8ff;border-radius:10px}.quiz label{display:block;margin:12px 0}.quiz input{width:auto}.video{width:100%;aspect-ratio:16/9;border:0}.footer{display:flex;justify-content:space-between;margin-top:30px}.field{display:block;margin:14px 0}.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}.field input,.field select{width:100%}.inlineEdit{width:100%;min-height:90px}.notice{padding:12px;color:#194f2b;background:#e8f7ea;border-radius:8px}h1{font-size:29px}h2{font-size:20px}@media(max-width:980px){.workspace{grid-template-columns:180px 1fr}.properties{grid-column:1/-1;position:static}}@media(max-width:640px){.workspace{display:block}.side{position:static;margin-bottom:12px}.split{grid-template-columns:1fr}}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin:20px 0}.menu-card{background:var(--tile,#eff5ff);color:var(--ink,#1e2c46);border:1px solid var(--accent,#205dc5);padding:24px;text-align:left;min-height:100px}.menu-card strong{display:block;font-size:19px;margin-bottom:12px}.menu-card span{color:var(--accent,#205dc5)}.menu-edit-card{padding:14px;border:1px solid #d5deea;border-radius:10px;margin:10px 0}.theme-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px}.theme-picker button.chosen{border:2px solid #205dc5}body[data-theme="classic"]{--accent:#205dc5;--tile:#eff5ff;--ink:#1e2c46}body[data-theme="modern"]{--accent:#8555d5;--tile:#f4edff;--ink:#322050;background:#f8f5ff}body[data-theme="nature"]{--accent:#19825f;--tile:#e6f6ec;--ink:#184c39;background:#f4faf5}body[data-theme="sunset"]{--accent:#cd6139;--tile:#fff1e6;--ink:#5c321f;background:#fff8f1}body[data-theme="midnight"]{--accent:#60a5fa;--tile:#24364d;--ink:#edf5ff;background:#162337;color:#dceaff}body[data-theme="midnight"] .side,body[data-theme="midnight"] .paper{background:#1d2d42;color:#e3edfa}body[data-theme="midnight"] .top{background:#1d2d42;color:#e3edfa}.menu-grid{grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:20px}.menu-card{border:1px solid #d9e3ef;border-radius:18px;overflow:hidden;padding:0;box-shadow:0 10px 30px #142b4514;transition:transform .15s,box-shadow .15s;background:var(--tile,#eff5ff);display:block;min-height:0}.menu-card:hover{transform:translateY(-3px);box-shadow:0 16px 35px #142b4525}.menu-card-inner{display:flex;align-items:flex-start;gap:16px;padding:22px}.menu-card-thumb{width:82px;height:82px;flex:none;object-fit:cover;border-radius:13px;background:#d6e4f8}.menu-card-placeholder{width:82px;height:82px;flex:none;border-radius:13px;background:var(--accent,#205dc5);opacity:.2}.menu-card-body{flex:1;min-width:0}.menu-card strong{font-size:20px;line-height:1.25;margin:0 0 9px}.menu-card-description{font-size:14px;line-height:1.45;white-space:pre-wrap;margin:0 0 14px;opacity:.85}.menu-edit-card{background:var(--tile,#f3f7ff);border-radius:15px;padding:18px}.menu-card-controls{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.menu-card-controls input[type=file]{width:100%;font-size:12px}.side,.paper{box-shadow:0 5px 18px #132e5010}.paper{padding:28px}.hero{background:linear-gradient(120deg,#e9f0ff,#fafcff);border:1px solid #dce5f2}.top{box-shadow:0 2px 10px #1231530a}body[data-theme="midnight"] .menu-card{border-color:#3b5472}body[data-theme="midnight"] .menu-edit-card{color:#203044}</style></head><body><div id="app"></div><div id="startup-status" style="margin:24px auto;max-width:740px;padding:20px;background:white;border:1px solid #dde5f2;border-radius:12px;color:#233957;font:16px system-ui">Loading Learning Studio… <span style="color:#607086">If this message stays visible, the application has not started correctly.</span></div><script>
window.addEventListener('error',function(e){let el=document.getElementById('startup-status');if(el){el.innerHTML='<strong>Learning Studio could not start.</strong><p>'+String(e.message||'Unknown browser error').replace(/[<>]/g,'')+'</p><p>Please send a screenshot of this message.</p>';}});
window.addEventListener('unhandledrejection',function(e){let el=document.getElementById('startup-status');if(el){el.textContent='Learning Studio error: '+String(e.reason?.message||e.reason||'Unknown error');}});
</script><script>
const app=document.getElementById('app');let admin=false,course=null,id=null,activePage=null,activeBlock=null,mode='home',published=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID();
async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function button(label,act,primary=false){return `<button class="${primary?'primary':''}" data-action="${esc(act)}">${esc(label)}</button>`}
function renderHeader(){document.getElementById('startup-status')?.remove();return `<header class="top"><div class="brand">◈ Learning <span>Studio</span></div><div class="actions">${mode==='edit'?button('Dashboard','home')+button('Save draft','save')+button('Preview','preview')+button('Publish','publish',true):mode==='preview'?button('Back to editing','edit'):button('All learning','home')}${admin?button('Log out','logout'):button('Admin login','login')}</div></header>`}
function normalizeCourse(){if(!course.menuPageId){course.menuPageId=course.pages[0].id;if(course.pages[0].title==='Welcome')course.pages[0].title='Learning menu'}course.menuCards=Array.isArray(course.menuCards)?course.menuCards:[];course.theme=course.theme||'classic'}
function menuId(){return course.menuPageId||course.pages[0].id}
function isMenu(){return activePage===menuId()}
function setTheme(){document.body.dataset.theme=course?.theme||'classic'}
function menuCards(editing=false){return editing?'<h2>Learning menu</h2><p class="muted">Every card is linked to a learning page. Edit the description and upload a thumbnail below.</p>'+course.menuCards.map((card,i)=>'<div class="menu-edit-card"><strong>'+esc(card.title)+'</strong><div class="field"><label for="carddesc'+i+'">Card description</label><textarea id="carddesc'+i+'" data-carddesc="'+i+'" maxlength="500" placeholder="Add a short description for learners...">'+esc(card.description||'')+'</textarea></div><div class="field"><label for="cardimg'+i+'">Small card image (maximum 300 KB)</label><input id="cardimg'+i+'" type="file" accept="image/png,image/jpeg,image/webp" data-cardimg="'+i+'"></div>'+(card.image?'<img src="'+esc(card.image)+'" alt="" class="menu-card-thumb">'+button('Remove image','clearcardimg:'+i):'')+'<div class="menu-card-controls">'+button('Open page','page:'+card.pageId)+button('Rename card','renamecard:'+i)+button('Remove card','removecard:'+i)+'</div></div>').join('')+button('+ Add menu card and page','newcard',true):'<div class="menu-grid">'+course.menuCards.filter(card=>course.pages.some(p=>p.id===card.pageId)).map(card=>'<button class="menu-card" data-action="page:'+esc(card.pageId)+'"><span class="menu-card-inner">'+(card.image?'<img class="menu-card-thumb" src="'+esc(card.image)+'" alt="">':'<span class="menu-card-placeholder"></span>')+'<span class="menu-card-body"><strong>'+esc(card.title)+'</strong>'+(card.description?'<span class="menu-card-description" style="display:block">'+esc(card.description)+'</span>':'')+'<span>Explore topic →</span></span></span></button>').join('')+'</div>'}
function page(){return course.pages.find(p=>p.id===activePage)||course.pages[0]}
function currentBlock(){return page()?.blocks.find(b=>b.id===activeBlock)}
function streamUrl(s){try{const u=new URL(s);return u.protocol==='https:'&&/(^|\.)(sharepoint\.com|microsoft\.com)$/.test(u.hostname)||u.protocol==='https:'&&u.hostname==='web.microsoftstream.com'}catch{return false}}
function renderBlock(b,edit=false){let x='';if(b.type==='text')x=`<p style="white-space:pre-wrap">${esc(b.text)}</p>`;
if(b.type==='image')x=`<div class="${b.layout==='left'||b.layout==='right'?'split':''}">${b.layout==='right'?`<p>${esc(b.text)}</p>`:''}${b.src?`<img class="image" src="${esc(b.src)}" alt="${esc(b.alt||'')}">`:'<p class="muted">Upload an image in Properties</p>'}${b.layout==='left'?`<p>${esc(b.text)}</p>`:''}</div>`;
if(b.type==='video')x=b.url&&streamUrl(b.url)?`<iframe class="video" src="${esc(b.url)}" title="Microsoft Stream video" allow="autoplay; fullscreen" allowfullscreen></iframe>`:'<p class="muted">Paste a Stream embed URL in Properties</p>';
if(b.type==='info')x=`<div class="info"><strong>${esc(b.heading||'Key point')}</strong><p>${esc(b.text)}</p></div>`;
if(b.type==='quiz'){const q=b.questions[0];x=`<div class="quiz"><strong>${esc(q.prompt)}</strong>${q.options.map((op,i)=>`<label><input type="${q.multiple?'checkbox':'radio'}" name="q_${b.id}" value="${i}" ${edit?'disabled':''}>${esc(op)}</label>`).join('')}${edit?'<p class="muted">Optional knowledge check — learners can always continue.</p>':button('Check answer','check:'+b.id,true)+`<div role="status" id="feedback_${b.id}"></div>`}</div>`}
return `<div class="block ${edit&&activeBlock===b.id?'active':''}" ${edit?'draggable="true" data-drag="'+b.id+'"':''}>${edit?`<div class="toolbar"><small style="margin-right:auto">⋮⋮ ${esc(b.type)}</small>${button('Edit','select:'+b.id)}${button('Copy','duplicate:'+b.id)}${button('Delete','remove:'+b.id)}</div>`:''}${x}</div>`}
async function home(){mode='home';const list=await api('/api/published'),all=admin?await api('/api/courses'):[];app.innerHTML=renderHeader()+`<main class="wrap"><div class="hero"><h1>Build better learning</h1><p>Pages, media and optional knowledge checks — made simple.</p>${admin?button('+ New learning','create',true):''}</div>${admin?`<h2>Administrator dashboard</h2><div class="grid">${all.map(c=>`<article class="card"><h2>${esc(c.title)}</h2><p class="muted">${c.published?'Published':'Draft'}</p>${button('Edit','open:'+c.id,true)} ${button('Delete','delete:'+c.id)}</article>`).join('')||'<p>No courses yet.</p>'}</div>`:''}<h2>Published learning</h2><div class="grid">${list.map(c=>`<article class="card"><h2>${esc(c.title)}</h2>${button('Start learning','learn:'+c.id,true)}</article>`).join('')||'<p>No published learning yet.</p>'}</div></main>`;wire()}
function properties(){const b=currentBlock();let out='<h2>Learning design</h2><div class="theme-picker">'+[['classic','Classic blue'],['modern','Modern purple'],['nature','Nature green'],['sunset','Warm sunset'],['midnight','Midnight']].map(([key,name])=>'<button class="'+(course.theme===key?'chosen':'')+'" data-action="theme:'+key+'">'+name+'</button>').join('')+'</div>'+`<h2>Page settings</h2>${field('Course title','courseTitle',course.title)}${field('Page title','pageTitle',page().title)}<div class="field"><label for="link">After this page</label><select id="link" data-prop="link"><option value="next">Next page</option><option value="menu">Main menu</option><option value="none">No next button</option>${course.pages.filter(p=>p.id!==activePage).map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select></div>`;
if(isMenu())return out+'<p class="muted">Each card creates and links a learning page automatically.</p>';if(!b)return out+'<p class="muted">Choose a content block to edit.</p>';
out+=`<hr><h2>${esc(b.type)} block</h2>`;
if(b.type==='text'||b.type==='info')out+=(b.type==='info'?field('Panel heading','heading',b.heading):'')+field('Text','text',b.text,true);
if(b.type==='image')out+=`<div class="field"><label>Upload image (600 KB maximum)</label><input type="file" id="upload" accept="image/*"></div>`+field('Alternative text','alt',b.alt)+field('Text beside image','text',b.text,true)+`<div class="field"><label>Layout</label><select data-bprop="layout">${['full','left','right'].map(v=>`<option value="${v}" ${b.layout===v?'selected':''}>${v==='full'?'Image only':v==='left'?'Image left':'Image right'}</option>`).join('')}</select></div>`;
if(b.type==='video')out+=field('Microsoft Stream embed URL','url',b.url);
if(b.type==='quiz'){const q=b.questions[0];out+=field('Question','prompt',q.prompt,true)+`<div class="field"><label>Answer type</label><select id="qtype"><option value="single">One correct answer</option><option value="multiple" ${q.multiple?'selected':''}>Several correct answers</option></select></div>`+q.options.map((v,i)=>`<div class="field"><label>Answer ${i+1}</label><input data-option="${i}" value="${esc(v)}"><label><input type="${q.multiple?'checkbox':'radio'}" name="correct" data-correct="${i}" ${q.correct.includes(i)?'checked':''}> Correct</label></div>`).join('')+button('+ Answer','addanswer')+button('Remove answer','removeanswer')+field('Correct feedback','correctFeedback',q.correctFeedback)+field('Incorrect feedback','wrongFeedback',q.wrongFeedback)}
return out}
function field(label,name,value='',multiline=false){return `<div class="field"><label>${esc(label)}</label>${multiline?`<textarea data-bprop="${name}">${esc(value)}</textarea>`:`<input data-${name==='courseTitle'||name==='pageTitle'?'prop':'bprop'}="${name}" value="${esc(value||'')}">`}</div>`}
function edit(){mode='edit';normalizeCourse();setTheme();if(!course.pages.some(p=>p.id===activePage))activePage=menuId();app.innerHTML=renderHeader()+`<div class="workspace"><aside class="side"><h2>Pages</h2>${course.pages.map(p=>button(p.id===menuId()?'⌂ '+p.title:p.title,'page:'+p.id)).join('')}<p>${button('+ Add menu card','newcard',true)}</p>${!isMenu()?button('Delete page','delpage'):''}</aside><main class="paper"><h1>${esc(page().title)}</h1>${isMenu()?menuCards(true):'<p class="muted">Drag a section to reorder it</p>'+page().blocks.map(b=>renderBlock(b,true)).join('')+button('+ Add content','addblock',true)}</main><aside class="side properties">${properties()}</aside></div>`;const sel=document.querySelector('[data-prop="link"]');if(sel)sel.value=page().link||'next';wire();wireProperties();wireCards();drag()}
function learner(preview=false){mode=preview?'preview':'learn';normalizeCourse();setTheme();const p=page(),index=course.pages.indexOf(p);app.innerHTML=renderHeader()+`<div class="workspace" style="grid-template-columns:235px minmax(0,1fr)"><aside class="side"><h2>${esc(course.title)}</h2>${button('⌂ Learning menu','page:'+menuId())}${course.menuCards.map(card=>button(card.title,'page:'+card.pageId)).join('')}</aside><main class="paper"><h1>${esc(p.title)}</h1>${isMenu()?menuCards(false):p.blocks.map(b=>renderBlock(b)).join('')+`<div class="footer">${button('← Back to menu','menu')}${button('Next page →','next',true)}</div>`}</main></div>`;wire()}
function wireCards(){document.querySelectorAll('[data-carddesc]').forEach(el=>{el.onchange=()=>{const card=course.menuCards[Number(el.dataset.carddesc)];if(card)card.description=el.value}});document.querySelectorAll('[data-cardimg]').forEach(el=>{el.onchange=()=>{const file=el.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>300000)return alert('Please choose a PNG, JPG or WebP under 300 KB');const reader=new FileReader();reader.onload=()=>{const card=course.menuCards[Number(el.dataset.cardimg)];if(card){card.image=reader.result;edit()}};reader.readAsDataURL(file)}})}
function wireProperties(){document.querySelectorAll('[data-prop]').forEach(e=>e.onchange=()=>{if(e.dataset.prop==='courseTitle')course.title=e.value;if(e.dataset.prop==='pageTitle')page().title=e.value;if(e.dataset.prop==='link')page().link=e.value;edit()});document.querySelectorAll('[data-bprop]').forEach(e=>e.onchange=()=>{let b=currentBlock();if(b.type==='quiz')b.questions[0][e.dataset.bprop]=e.value;else b[e.dataset.bprop]=e.value;edit()});document.querySelectorAll('[data-option]').forEach(e=>e.onchange=()=>{currentBlock().questions[0].options[+e.dataset.option]=e.value;edit()});document.querySelectorAll('[data-correct]').forEach(e=>e.onchange=()=>{let q=currentBlock().questions[0],i=+e.dataset.correct;if(!q.multiple)q.correct=[i];else q.correct=e.checked?[...new Set([...q.correct,i])]:q.correct.filter(n=>n!==i);edit()});const t=document.getElementById('qtype');if(t)t.onchange=()=>{const q=currentBlock().questions[0];q.multiple=t.value==='multiple';q.correct=[0];edit()};const u=document.getElementById('upload');if(u)u.onchange=()=>{const f=u.files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>600000)return alert('Use an image smaller than 600 KB');const reader=new FileReader();reader.onload=()=>{currentBlock().src=reader.result;edit()};reader.readAsDataURL(f)}}
function drag(){let moving;document.querySelectorAll('[data-drag]').forEach(e=>{e.ondragstart=()=>moving=e.dataset.drag;e.ondragover=ev=>ev.preventDefault();e.ondrop=ev=>{ev.preventDefault();let blocks=page().blocks,i=blocks.findIndex(b=>b.id===moving),j=blocks.findIndex(b=>b.id===e.dataset.drag);if(i>=0&&j>=0&&i!==j)blocks.splice(j,0,blocks.splice(i,1)[0]);edit()}})}
async function open(id,view=false){const r=await api(view?'/api/published/'+id:'/api/courses/'+id);course=view?r:r.course;published=view||!!r.published;normalizeCourse();activePage=menuId();activeBlock=null;window.courseId=id;view?learner():edit()}
const actions={home,menu:()=>{activePage=menuId();learner(mode==='preview')},next:()=>{const i=course.pages.findIndex(p=>p.id===activePage);activePage=course.pages[i+1]?.id||menuId();learner(mode==='preview')},newcard:()=>{const name=prompt('Name of menu card and learning page','New topic')?.trim();if(!name)return;const p={id:uid(),title:name,blocks:[],link:'next'};course.pages.push(p);course.menuCards.push({title:name,pageId:p.id});activePage=menuId();activeBlock=null;edit()},login:()=>{mode='login';app.innerHTML=renderHeader()+`<main class="wrap" style="max-width:450px"><section class="card"><h1>Administrator login</h1><label for="pw">Password</label><input type="password" id="pw"><p>${button('Log in','submitlogin',true)}</p><p id="error" role="alert"></p></section></main>`;wire()},submitlogin:async()=>{try{await api('/api/login','POST',{password:document.getElementById('pw').value});admin=true;home()}catch(e){document.getElementById('error').textContent=e.message}},logout:async()=>{await api('/api/logout','POST');admin=false;home()},create:async()=>{const r=await api('/api/courses','POST');open(r.id)},save:async()=>{await api('/api/courses/'+window.courseId,'PUT',course);alert('Draft saved')},publish:async()=>{await api('/api/courses/'+window.courseId,'PUT',course);await api('/api/courses/'+window.courseId+'/publish','POST');published=true;alert('Published. Share: '+location.origin+'/?learn='+window.courseId);edit()},preview:()=>learner(true),edit,previous:()=>{let i=course.pages.findIndex(p=>p.id===activePage);activePage=course.pages[Math.max(0,i-1)].id;learner(mode==='preview')},continue:()=>{const p=page();if(p.link==='menu')return home();let next=p.link==='next'?course.pages[course.pages.indexOf(p)+1]?.id:p.link;if(!next)return home();activePage=next;learner(mode==='preview')},newpage:()=>{const t=prompt('New page title','New page');if(t){const p={id:uid(),title:t,blocks:[],link:'next'};course.pages.push(p);activePage=p.id;activeBlock=null;edit()}},delpage:()=>{if(isMenu())return alert('The learning menu cannot be deleted');if(course.pages.length===1)return alert('Keep at least one page');if(confirm('Delete this page?')){course.pages=course.pages.filter(p=>p.id!==activePage);course.menuCards=course.menuCards.filter(card=>card.pageId!==activePage);activePage=menuId();edit()}},addblock:()=>{const type=prompt('Block type: text, image, video, info or quiz','text')?.trim().toLowerCase();if(!['text','image','video','info','quiz'].includes(type))return;const b={id:uid(),type,text:type==='text'?'Enter your text':'',layout:'full',url:''};if(type==='quiz')b.questions=[{prompt:'Your question',options:['Answer A','Answer B'],correct:[0],multiple:false,correctFeedback:'Correct!',wrongFeedback:'Not quite. Try again.'}];page().blocks.push(b);activeBlock=b.id;edit()},addanswer:()=>{currentBlock().questions[0].options.push('Another answer');edit()},removeanswer:()=>{const q=currentBlock().questions[0];if(q.options.length>2){q.options.pop();q.correct=q.correct.filter(i=>i<q.options.length);edit()}}};
function wire(){document.querySelectorAll('[data-action]').forEach(el=>el.onclick=async()=>{try{const a=el.dataset.action;if(actions[a])return await actions[a]();if(a.startsWith('clearcardimg:')){const card=course.menuCards[Number(a.split(':')[1])];if(card)delete card.image;return edit()}if(a.startsWith('theme:')){course.theme=a.slice(6);return edit()}if(a.startsWith('renamecard:')){const card=course.menuCards[Number(a.split(':')[1])];if(!card)return;const name=prompt('Card and page name',card.title)?.trim();if(name){card.title=name;const p=course.pages.find(p=>p.id===card.pageId);if(p)p.title=name;}return edit()}if(a.startsWith('removecard:')){const i=Number(a.split(':')[1]),card=course.menuCards[i];if(card&&confirm('Remove this card and its page?')){course.pages=course.pages.filter(p=>p.id!==card.pageId);course.menuCards.splice(i,1);activePage=menuId()}return edit()}if(a.startsWith('open:'))return open(a.slice(5));if(a.startsWith('learn:'))return open(a.slice(6),true);if(a.startsWith('page:')){activePage=a.slice(5);activeBlock=null;return mode==='edit'?edit():learner(mode==='preview')}if(a.startsWith('select:')){activeBlock=a.slice(7);return edit()}if(a.startsWith('remove:')){page().blocks=page().blocks.filter(b=>b.id!==a.slice(7));activeBlock=null;return edit()}if(a.startsWith('duplicate:')){const b=page().blocks.find(b=>b.id===a.slice(10));page().blocks.push({...structuredClone(b),id:uid()});return edit()}if(a.startsWith('up:')||a.startsWith('down:')){const i=course.pages.findIndex(p=>p.id===a.split(':')[1]),j=i+(a.startsWith('up:')?-1:1);if(j>=0&&j<course.pages.length)course.pages.splice(j,0,course.pages.splice(i,1)[0]);return edit()}if(a.startsWith('delete:')){if(confirm('Permanently delete this course?')){await api('/api/courses/'+a.slice(7),'DELETE');home()}return}if(a.startsWith('check:')){const b=page().blocks.find(b=>b.id===a.slice(6)),q=b.questions[0],chosen=[...document.querySelectorAll(`input[name="q_${b.id}"]:checked`)].map(x=>+x.value);const good=[...chosen].sort().join(',')===[...q.correct].sort().join(',');document.getElementById('feedback_'+b.id).textContent=good?q.correctFeedback:q.wrongFeedback;return}}catch(e){alert(e.message)}})}
(async()=>{try{admin=(await api('/api/session')).admin;const id=new URLSearchParams(location.search).get('learn');if(id)await open(id,true);else await home()}catch(e){app.innerHTML=`<main class="wrap"><section class="card"><h1>Setup required</h1><p>${esc(e.message)}</p><p>Connect your Cloudflare D1 database and configure Worker secrets.</p></section></main>`}})();
</script></body></html>
