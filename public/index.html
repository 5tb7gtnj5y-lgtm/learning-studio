function formatText(src){
 const inline=(s)=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
 const lines=String(src||'').split(/\r?\n/);let out='',inList=false;
 const close=()=>{if(inList){out+='</ul>';inList=false}};
 for(const line of lines){
   const title=line.match(/^(#{1,3})\s+(.*)$/),bullet=line.match(/^\s*[-•]\s+(.*)$/);
   if(title){close();const n=Math.min(4,title[1].length+1);out+='<h'+n+'>'+inline(title[2])+'</h'+n+'>';}
   else if(bullet){if(!inList){out+='<ul>';inList=true}out+='<li>'+inline(bullet[1])+'</li>';}
   else if(!line.trim()){close();out+='<div class="text-gap"></div>';}
   else {close();out+='<p>'+inline(line)+'</p>';}
 }
 close();return '<div class="lesson-text">'+out+'</div>';
}

function auditCourse(){
 const findings=[];
 if(!course.title?.trim())findings.push('Learning package has no title');
 if(!course.menuCards?.length)findings.push('Learning menu has no cards');
 for(const p of course.pages){
  if(!p.title?.trim())findings.push('A page is missing its title');
  for(const b of p.blocks||[]){
   if(b.type==='image'&&b.src&&!String(b.alt||'').trim())findings.push(p.title+': image needs descriptive alternative text');
   if(b.type==='gallery')for(const item of b.items||[])if(item.image&&!String(item.body||'').trim())findings.push(p.title+': gallery image needs descriptive alternative text');
   if(b.type==='video')findings.push(p.title+': check that your Microsoft Stream video has captions or a transcript');
   if(b.type==='quiz'&&(!b.questions?.[0]?.prompt?.trim()||!b.questions?.[0]?.correct?.length))findings.push(p.title+': knowledge check is missing its question or correct answer');
   if(b.type==='linkbutton'&&!b.target)findings.push(p.title+': a page button has no target');
   if(['accordion','tabs','flashcards','process','timeline','scenario','checklist'].includes(b.type)&&(!b.items||b.items.length<2))findings.push(p.title+': '+b.type+' interaction needs at least two items');
  }
 }
 return findings;
}

.value.slice(end);return edit()}if(a.startsWith('template:'))return insertTemplate(a.slice(9));if(a.startsWith('duplicatecourse:')){const source=await api('/api/courses/'+a.slice(16));const newCourse=JSON.parse(JSON.stringify(source.course));newCourse.title+=' (copy)';const created=await api('/api/courses','POST');await api('/api/courses/'+created.id,'PUT',newCourse);return home()}if(a.startsWith('insert:')){const type=a.slice(7);if(!blockCatalog().some(row=>row[0]===type))return;const b=createStarterBlock(type);page().blocks.splice(Math.max(0,Math.min(insertPosition,page().blocks.length)),0,b);activeBlock=b.id;blockPickerOpen=false;return edit()}if(a.startsWith('itemadd')){const b=currentBlock();if(b&&Array.isArray(b.items)){b.items.push({title:'New item',body:'Add details here'});return edit()}}if(a.startsWith('itemremove:')||a.startsWith('itemup:')||a.startsWith('itemdown:')){const b=currentBlock();if(!b||!Array.isArray(b.items))return;const i=Number(a.split(':')[1]);if(a.startsWith('itemremove:')){if(b.items.length>1)b.items.splice(i,1)}else{const j=i+(a.startsWith('itemup:')?-1:1);if(j>=0&&j<b.items.length)b.items.splice(j,0,b.items.splice(i,1)[0])}return edit()}if(a.startsWith('tab:')){const [,blockId,n]=a.split(':');tabSelection[blockId]=Number(n);return mode==='edit'?edit():learner(mode==='preview')}if(a.startsWith('scenario:')){const [,blockId,n]=a.split(':');const b=page().blocks.find(p=>p.id===blockId);const dest=document.getElementById('scenario_'+blockId);if(dest&&b?.items?.[Number(n)]){dest.textContent=b.items[Number(n)].body;dest.classList.add('notice')}return}if(a.startsWith('clearcardimg:')){const card=course.menuCards[Number(a.split(':')[1])];if(card)delete card.image;return edit()}if(a.startsWith('theme:')){course.theme=a.slice(6);return edit()}if(a.startsWith('renamecard:')){const card=course.menuCards[Number(a.split(':')[1])];if(!card)return;const name=prompt('Card and page name',card.title)?.trim();if(name){card.title=name;const p=course.pages.find(p=>p.id===card.pageId);if(p)p.title=name;}return edit()}if(a.startsWith('removecard:')){const i=Number(a.split(':')[1]),card=course.menuCards[i];if(card&&confirm('Remove this card and its page?')){course.pages=course.pages.filter(p=>p.id!==card.pageId);course.menuCards.splice(i,1);activePage=menuId()}return edit()}if(a.startsWith('open:'))return open(a.slice(5));if(a.startsWith('learn:'))return open(a.slice(6),true);if(a.startsWith('page:')){activePage=a.slice(5);activeBlock=null;return mode==='edit'?edit():mode==='review'?reviewViewer():learner(mode==='preview')}if(a.startsWith('select:')){activeBlock=a.slice(7);return edit()}if(a.startsWith('remove:')){page().blocks=page().blocks.filter(b=>b.id!==a.slice(7));activeBlock=null;return edit()}if(a.startsWith('duplicate:')){const b=page().blocks.find(b=>b.id===a.slice(10));const index=page().blocks.findIndex(x=>x.id===b.id);page().blocks.splice(index+1,0,{...JSON.parse(JSON.stringify(b)),id:uid()});return edit()}if(a.startsWith('up:')||a.startsWith('down:')){const i=course.pages.findIndex(p=>p.id===a.split(':')[1]),j=i+(a.startsWith('up:')?-1:1);if(j>=0&&j<course.pages.length)course.pages.splice(j,0,course.pages.splice(i,1)[0]);return edit()}if(a.startsWith('delete:')){if(confirm('Permanently delete this course?')){await api('/api/courses/'+a.slice(7),'DELETE');home()}return}if(a.startsWith('check:')){const b=page().blocks.find(b=>b.id===a.slice(6)),q=b.questions[0],chosen=[...document.querySelectorAll(`input[name="q_${b.id}"]:checked`)].map(x=>+x.value);const good=[...chosen].sort().join(',')===[...q.correct].sort().join(',');document.getElementById('feedback_'+b.id).textContent=good?q.correctFeedback:q.wrongFeedback;return}}catch(e){alert(e.message)}})}
